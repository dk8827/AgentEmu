# Dependency alerts remain enabled; update PRs are paused while Actions is disabled.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: pip
    directory: /training
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: github-actions
    directory: /
    ignore:
      - dependency-name: dtolnay/rust-toolchain
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
