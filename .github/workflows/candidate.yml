name: Unsigned test builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - name: Linux development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: cargo build --locked --release -p frontend-native
      - run: python scripts/package-native.py
      - uses: actions/upload-artifact@v4
        with:
          name: AgentEmu-native-${{ matrix.os }}-unsigned-test
          path: dist/native/
          retention-days: 7
