name: CI
on:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  release-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check.py release
      - run: python -m pip install ruff==0.15.0
      - run: ruff format --check scripts training
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/sync-integrations.py --check
      - run: python scripts/test-conformance.py --fetch --report .cache/conformance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hardware-conformance
          path: .cache/conformance.json
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux audio and gamepad development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: sh scripts/build-web.sh
      - run: node --test scripts/test-wasm.mjs scripts/test-player.mjs scripts/test-contra-wasm.mjs scripts/test-replay.mjs scripts/test-input-state.mjs scripts/test-agent-scope.mjs scripts/test-frame-clock.mjs scripts/test-shared-control.mjs scripts/test-runtime-audio.mjs scripts/test-compatibility-evidence.mjs
      - run: npm --prefix web ci
      - run: npm --prefix web exec -- playwright install --with-deps chromium
      - run: python3 scripts/package-web.py
      - run: node scripts/test-rust-ui.mjs
        env:
          AGENTEMU_PACKAGED: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: AgentEmu-web-test-build
          path: dist/web/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-ui-screenshots
          path: web/test-results/rust-ui/

  training-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install maturin==1.15.0 numpy==2.4.6 gymnasium==1.4.0
      - run: cargo clippy --locked -p training-bindings --features python -- -D warnings
      - run: cd training && maturin build --release --locked --out ../target/wheels
      - run: python -m pip install --no-deps target/wheels/contra_training-*.whl
      - run: python -m unittest discover -s training/tests -p test_contract.py
      - run: python -m unittest discover -s training/tests -p test_task_benchmark.py
      - run: python -m unittest discover -s training/tests -p test_release_contract.py

  training:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install maturin==1.15.0
      - run: cd training && maturin build --release --locked --out ../target/wheels
      - name: Install CPU PyTorch for training tests
        run: python -m pip install --no-cache-dir torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - name: Install complete training environment
        run: python -m pip install --no-cache-dir target/wheels/contra_training-*.whl
      - run: python -m unittest discover -s training/tests
