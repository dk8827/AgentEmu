[workspace]
members = ["crates/game-integrations", "crates/session-engine", "crates/agent-runtime", "crates/web-runtime", "crates/nes-core", "crates/nes-cli", "crates/nes-video", "crates/frontend-native", "crates/contra-agent", "crates/training-bindings", "crates/player-ui"]
resolver = "3"

[workspace.package]
license = "MIT"
repository = "https://github.com/dk8827/AgentEmu"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safetensors = { version = "0.8", default-features = false, features = ["alloc"] }
wasm-bindgen = "=0.2.129"

[profile.release]
lto = "thin"
codegen-units = 1

[workspace.lints.rust]
unsafe_code = "forbid"
