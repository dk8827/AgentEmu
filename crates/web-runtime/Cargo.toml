[package]
license.workspace = true
repository.workspace = true
name = "web-runtime"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
session-engine = { path = "../session-engine" }
contra-agent = { path = "../contra-agent" }
agent-runtime = { path = "../agent-runtime" }
nes-core = { path = "../nes-core" }
nes-video = { path = "../nes-video" }
wasm-bindgen.workspace = true
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
wgpu = { version = "27", default-features = false, features = ["std", "wgsl", "webgpu", "webgl"] }

[lints]
workspace = true
